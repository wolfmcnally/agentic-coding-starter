# Editorial sidecar for briefs/methodology-treatise.md
# Governed by policies/treatise.md § "Intent is recorded beside the brief".
# Read before drafting. Update in the same pass that changes the treatise.
# `directives` is append-only: a reversal is a new dated entry, never an edit.

treatise: methodology-treatise
title: The Project Remembers
brief: briefs/methodology-treatise.md
updated: 2026-08-24

purpose: >-
  Explain what this repository is for and how its parts work, to a reader who
  has not seen it. It is the canonical outward explanation; every rendered
  format derives from the brief, and corrections land in the brief first.

audience:
  primary: >-
    Anyone evaluating or curious about the repository, whether or not they
    write software.
  range: >-
    Experienced engineers through readers who have never coded. Both ends must
    be able to finish the piece.
  may_assume: >-
    That the reader has heard of AI coding assistants and has some idea that
    software is built in steps. Nothing further.
  must_not_assume: >-
    Git vocabulary, test-suite vocabulary, agent-harness vocabulary, or any
    familiarity with this repository's own file layout and terms.
  not_written_for: >-
    Contributors needing implementation detail. They are served by the policies
    and the eleven-step brief, which this piece links rather than summarizes.

register:
  form: primer
  flow: magazine article
  voice_skills:
    - humanizer   # run over the finished text; no em dashes, no "not X but Y"
    - minto       # answer first, then MECE arguments, one concrete each
  constraints:
    - No self-congratulation. Praising the design reads as slop.
    - >-
      Present tense. Describe what the repository does, never where it has
      been. No "until recently", no origin stories, no version history.
    - Explain each term in plain words at first use.
    - >-
      File paths and commands stay out of the argument. They belong in the
      getting-started section and in the linked briefs.
    - Sentence-case headings. Straight quotes. No emoji.

scope:
  includes:
    - The repository's purpose as an opinionated, evolving practice collection.
    - The claim that the project, rather than the conversation, holds the state.
    - The three failures the method answers, and one answer per failure.
    - The four roles, the two-run close, and the acceptance boundary.
    - The lessons ledger and the hub-and-spoke transfer between projects.
    - The honest costs, including where enforcement is written rather than mechanized.
    - Where to find the repository and the two ways to start using it.
  excludes:
    - A directory tour or a file inventory.
    - Change history of the methodology itself.
    - Implementation detail that the policies already own.
    - Any claim that cannot be traced to this repository or a dated external source.

