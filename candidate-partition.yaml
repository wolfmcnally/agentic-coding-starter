# Root-anchored JSON-quoted patterns; *, ? stay within a segment; ** spans segments.
# Bookkeeping carves out of active. Unclassified tracked paths refuse; unclassified
# nonignored untracked files remain included in product identity until classified.
schema: agentic.candidate-partition.v1
active:
  - "/candidate-partition.yaml"
  - "/.gitattributes"
  - "/.gitignore"
  - "/AGENTS.md"
  - "/LICENSE"
  - "/README.md"
  - "/RELEASES.md"
  - "/documentation.toml"
  - "/manual/**"
  - "/kickoff.yaml"
  - "/.agents/**"
  - "/.claude/**"
  - "/.codex/**"
  - "/.githooks/**"
  - "/.github/**"
  - "/bin/**"
  - "/briefs/**"
  - "/docs/**"
  - "/lib/**"
  - "/plan/**"
  - "/log/**"
  - "/collaboration/**"
  - "/policies/**"
  - "/project/**"
  - "/reports/**"
  - "/tests/**"
bookkeeping:
  - "/EXECUTION_LOG.jsonl"
  - "/plan/events/**"
  - "/log/entries/**"
  - "/lessons/**"
  - "/lessons-archived/**"
  - "/user-actions/**"
  - "/user-actions-archived/**"
